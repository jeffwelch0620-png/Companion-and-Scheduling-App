name: UI checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ui-checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  raw-colors:
    name: Raw colours stay within the shrinking allowance
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - name: Raw colours stay within the shrinking allowance (use --jm-* tokens)
        run: node scripts/check-raw-colors.mjs
