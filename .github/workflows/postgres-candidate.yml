name: PostgreSQL candidate
on:
  pull_request:
  push:
    branches: [main, 'codex/**']
permissions:
  contents: read
jobs:
  candidate-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 127.0.0.1:55461:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      CANDIDATE_TEST_DATABASE: companion_candidate_ci
      CANDIDATE_ALLOW_BOOTSTRAP: fictional-local-only
      CANDIDATE_BOOTSTRAP_USER: postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            development/postgres-candidate/package-lock.json
      - name: Install project dependencies
        run: npm ci --ignore-scripts
      - name: Install isolated candidate dependencies
        run: npm ci --prefix development/postgres-candidate --ignore-scripts
      - name: Install PostgreSQL test client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Apply ordered migrations to empty candidate database
        run: npm run bootstrap --prefix development/postgres-candidate
      - name: Run PostgreSQL and offline-queue regression checks
        run: npm test --prefix development/postgres-candidate
      - name: Validate candidate TypeScript
        run: npm run check:types --prefix development/postgres-candidate
      - name: Build original-form previews
        run: npm run build:preview --prefix development/postgres-candidate
